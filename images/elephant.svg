<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="title desc">
  <title id="title">Cartoon elephant</title>
  <desc id="desc">A friendly forward-facing elephant with big ears and a curled trunk.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3c2bf"/>
      <stop offset="1" stop-color="#7d9493"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="350" cy="518" rx="215" ry="28" fill="#315843" opacity=".35"/>

  <g stroke="#50696b" stroke-width="8" stroke-linejoin="round">
    <!-- back legs -->
    <path d="M212 400 L208 492 C208 508 252 508 252 492 L256 400Z" fill="#7d9493"/>
    <path d="M444 400 L448 492 C448 508 492 508 492 492 L488 400Z" fill="#7d9493"/>

    <!-- body -->
    <ellipse cx="350" cy="372" rx="192" ry="122" fill="url(#skin)"/>

    <!-- front legs -->
    <path d="M262 410 L258 498 C258 516 312 516 312 498 L308 410Z" fill="#94a8a5"/>
    <path d="M392 410 L388 498 C388 516 442 516 442 498 L438 410Z" fill="#94a8a5"/>

    <!-- ears -->
    <ellipse cx="180" cy="205" rx="122" ry="142" fill="#94a8a5" transform="rotate(-14 180 205)"/>
    <ellipse cx="520" cy="205" rx="122" ry="142" fill="#94a8a5" transform="rotate(14 520 205)"/>
  </g>

  <!-- inner ears -->
  <ellipse cx="188" cy="210" rx="74" ry="98" fill="#e2b8b2" opacity=".55" transform="rotate(-14 188 210)"/>
  <ellipse cx="512" cy="210" rx="74" ry="98" fill="#e2b8b2" opacity=".55" transform="rotate(14 512 210)"/>

  <!-- head -->
  <ellipse cx="350" cy="205" rx="150" ry="140" fill="url(#skin)" stroke="#50696b" stroke-width="8"/>

  <!-- tusks -->
  <path d="M302 282 C290 306 276 318 258 322 C276 330 302 318 316 290Z" fill="#f7f1dc" stroke="#50696b" stroke-width="6" stroke-linejoin="round"/>
  <path d="M398 282 C410 306 424 318 442 322 C424 330 398 318 384 290Z" fill="#f7f1dc" stroke="#50696b" stroke-width="6" stroke-linejoin="round"/>

  <!-- trunk: outline stroke, then fill stroke on top -->
  <path d="M350 230 C348 300 342 360 362 402 C378 434 424 432 428 400 C431 380 414 372 402 384" fill="none" stroke="#50696b" stroke-width="58" stroke-linecap="round"/>
  <path d="M350 230 C348 300 342 360 362 402 C378 434 424 432 428 400 C431 380 414 372 402 384" fill="none" stroke="#a3b4b1" stroke-width="42" stroke-linecap="round"/>
  <!-- trunk wrinkles -->
  <g fill="none" stroke="#7d9493" stroke-width="5" stroke-linecap="round">
    <path d="M334 290 Q350 298 364 290"/>
    <path d="M332 320 Q348 328 362 320"/>
    <path d="M336 350 Q352 358 366 350"/>
  </g>

  <!-- eyes -->
  <circle cx="300" cy="186" r="15" fill="#304d53"/>
  <circle cx="400" cy="186" r="15" fill="#304d53"/>
  <circle cx="305" cy="180" r="5" fill="#f5f0c8"/>
  <circle cx="405" cy="180" r="5" fill="#f5f0c8"/>

  <!-- cheeks -->
  <ellipse cx="262" cy="236" rx="22" ry="13" fill="#e59a94" opacity=".35"/>
  <ellipse cx="438" cy="236" rx="22" ry="13" fill="#e59a94" opacity=".35"/>

  <!-- toenails -->
  <g fill="none" stroke="#304d53" stroke-width="7" stroke-linecap="round">
    <path d="M268 500 Q285 492 302 500"/>
    <path d="M398 500 Q415 492 432 500"/>
  </g>
</svg>
