<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Cartoon of a LEGO robot with long legs and gripper feet doing a silly walk toward a finish flag">
  <!-- Illustration, not a photo of the real robot -->
  <rect width="800" height="600" fill="#e4eef7"/>
  <rect y="470" width="800" height="130" fill="#d8bd96"/>
  <path d="M0 470 H800" stroke="#3b2a1f" stroke-width="6"/>
  <!-- footprints -->
  <g fill="#b9996f">
    <ellipse cx="80" cy="520" rx="22" ry="9"/><ellipse cx="160" cy="545" rx="22" ry="9"/>
    <ellipse cx="230" cy="515" rx="22" ry="9"/>
  </g>
  <!-- finish flag -->
  <path d="M700 470 V170" stroke="#3b2a1f" stroke-width="8" stroke-linecap="round"/>
  <g stroke="#3b2a1f" stroke-width="5">
    <rect x="704" y="172" width="80" height="56" fill="#fff"/>
  </g>
  <g fill="#3b2a1f">
    <rect x="704" y="172" width="20" height="14"/><rect x="744" y="172" width="20" height="14"/>
    <rect x="724" y="186" width="20" height="14"/><rect x="764" y="186" width="20" height="14"/>
    <rect x="704" y="200" width="20" height="14"/><rect x="744" y="200" width="20" height="14"/>
    <rect x="724" y="214" width="20" height="14"/><rect x="764" y="214" width="20" height="14"/>
  </g>
  <!-- motion lines -->
  <path d="M200 230 h-70 M210 270 h-100 M200 310 h-60" stroke="#2a5f93" stroke-width="8" stroke-linecap="round"/>
  <!-- legs: back leg planted, front leg kicked high -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M340 300 L300 380 L320 455" stroke="#3b2a1f" stroke-width="30"/>
    <path d="M340 300 L300 380 L320 455" stroke="#fff" stroke-width="18"/>
    <path d="M460 300 L560 330 L600 260" stroke="#3b2a1f" stroke-width="30"/>
    <path d="M460 300 L560 330 L600 260" stroke="#fff" stroke-width="18"/>
  </g>
  <g stroke="#3b2a1f" stroke-width="6">
    <circle cx="300" cy="380" r="22" fill="#2a5f93"/>
    <circle cx="560" cy="330" r="22" fill="#2a5f93"/>
  </g>
  <!-- gripper feet -->
  <g fill="#e05a5a" stroke="#3b2a1f" stroke-width="5" stroke-linejoin="round">
    <path d="M296 452 h50 l14 18 h-22 l-8 -8 -8 8 h-22 l-8 -8 -8 8 h-12z"/>
    <path d="M590 240 l30 -12 10 22 -12 8 -6 -10 -10 6 -6 -10 -10 6z" transform="rotate(10 610 245)"/>
  </g>
  <!-- body: SPIKE hub -->
  <g stroke="#3b2a1f" stroke-width="6" stroke-linejoin="round">
    <rect x="300" y="120" width="200" height="190" rx="24" fill="#fff"/>
    <rect x="300" y="120" width="200" height="60" rx="24" fill="#f2c94c"/>
    <circle cx="400" cy="275" r="14" fill="#e4eef7"/>
  </g>
  <g fill="#2a5f93">
    <rect x="348" y="200" width="22" height="22" rx="4"/><rect x="430" y="200" width="22" height="22" rx="4"/>
    <rect x="360" y="238" width="80" height="12" rx="6"/>
  </g>
  <path d="M400 120 v-36" stroke="#3b2a1f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="400" cy="78" r="12" fill="#e05a5a" stroke="#3b2a1f" stroke-width="5"/>
  <!-- Jumbo cheering -->
  <g transform="translate(30 330) scale(0.62)">
    <g stroke="#3b2a1f" stroke-width="7" stroke-linejoin="round">
      <ellipse cx="56" cy="104" rx="48" ry="54" fill="#a9b4c1"/>
      <ellipse cx="60" cy="108" rx="30" ry="36" fill="#f6b6c6" stroke="none"/>
      <ellipse cx="184" cy="104" rx="48" ry="54" fill="#a9b4c1"/>
      <ellipse cx="180" cy="108" rx="30" ry="36" fill="#f6b6c6" stroke="none"/>
      <circle cx="120" cy="104" r="60" fill="#bcc6d2"/>
    </g>
    <path d="M88 98 q10 -12 20 0 M132 98 q10 -12 20 0" fill="none" stroke="#1f2630" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="86" cy="124" rx="10" ry="6.5" fill="#f6a3b8"/><ellipse cx="154" cy="124" rx="10" ry="6.5" fill="#f6a3b8"/>
    <path d="M120 116 C120 80 150 60 170 40" fill="none" stroke="#3b2a1f" stroke-width="30" stroke-linecap="round"/>
    <path d="M120 116 C120 80 150 60 170 40" fill="none" stroke="#bcc6d2" stroke-width="20" stroke-linecap="round"/>
    <ellipse cx="100" cy="150" rx="14" ry="10" fill="#3b2a1f"/>
  </g>
</svg>
