    <circle cx="760" cy="300" r="4"/><circle cx="620" cy="330" r="3"/><circle cx="60" cy="480" r="4"/>
    <circle cx="180" cy="560" r="3"/><circle cx="470" cy="40" r="3"/><circle cx="700" cy="40" r="2.5"/>
