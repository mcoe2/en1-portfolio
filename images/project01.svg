<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Cartoon of Jumbo the elephant throwing a frisbee on an ultimate field, with a LEGO brick">
  <!-- Illustration, not a photo of the real build -->
  <rect width="800" height="600" fill="#8fc3ea"/>
  <circle cx="690" cy="80" r="44" fill="#f2c94c" stroke="#3b2a1f" stroke-width="6"/>
  <path d="M90 90 q20 -26 50 -10 q22 -20 46 4 q26 -2 26 22 h-130 q-12 -8 8 -16z" fill="#fff" stroke="#3b2a1f" stroke-width="5" stroke-linejoin="round"/>
  <!-- field -->
  <rect y="230" width="800" height="370" fill="#4f9d4f"/>
  <rect y="230" width="800" height="60" fill="#5aab5a"/>
  <rect y="350" width="800" height="60" fill="#5aab5a"/>
  <rect y="470" width="800" height="60" fill="#5aab5a"/>
  <path d="M0 230 H800" stroke="#3b2a1f" stroke-width="6"/>
  <path d="M560 230 L620 600" stroke="#fff" stroke-width="10"/>
  <!-- cones -->
  <path d="M600 250 l14 -34 14 34z" fill="#ee8a2b" stroke="#3b2a1f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M700 520 l18 -44 18 44z" fill="#ee8a2b" stroke="#3b2a1f" stroke-width="5" stroke-linejoin="round"/>
  <!-- flight path and disc -->
  <path d="M380 320 Q500 110 610 170" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="4 16" stroke-linecap="round"/>
  <g transform="rotate(-12 640 170)">
    <ellipse cx="640" cy="170" rx="72" ry="24" fill="#2a5f93" stroke="#3b2a1f" stroke-width="6"/>
    <ellipse cx="640" cy="166" rx="44" ry="12" fill="none" stroke="#c9dcee" stroke-width="4"/>
  </g>
  <path d="M540 120 h-50 M550 150 h-70 M545 180 h-45" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <!-- LEGO brick -->
  <g stroke="#3b2a1f" stroke-width="5" stroke-linejoin="round">
    <rect x="470" y="470" width="150" height="70" rx="6" fill="#e05a5a"/>
    <rect x="482" y="448" width="34" height="24" rx="4" fill="#e05a5a"/>
    <rect x="528" y="448" width="34" height="24" rx="4" fill="#e05a5a"/>
    <rect x="574" y="448" width="34" height="24" rx="4" fill="#e05a5a"/>
  </g>
  <!-- Jumbo, trunk up after the throw -->
  <g transform="translate(110 250) scale(1.2)">
    <g stroke="#3b2a1f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="56" cy="104" rx="48" ry="54" fill="#a9b4c1"/>
      <ellipse cx="60" cy="108" rx="30" ry="36" fill="#f6b6c6" stroke="none"/>
      <ellipse cx="184" cy="104" rx="48" ry="54" fill="#a9b4c1"/>
      <ellipse cx="180" cy="108" rx="30" ry="36" fill="#f6b6c6" stroke="none"/>
      <circle cx="120" cy="104" r="60" fill="#bcc6d2"/>
      <path d="M113 46 Q110 34 102 31 M120 45 Q120 32 121 27 M127 46 Q131 34 139 32" fill="none" stroke-width="4"/>
    </g>
    <path d="M60 52 l120 0 l-10 -18 q-50 -16 -100 0z" fill="#2a5f93" stroke="#3b2a1f" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="86" cy="124" rx="10" ry="6.5" fill="#f6a3b8"/>
    <ellipse cx="154" cy="124" rx="10" ry="6.5" fill="#f6a3b8"/>
    <path d="M90 98 q8 -10 16 0 M134 98 q8 -10 16 0" fill="none" stroke="#1f2630" stroke-width="5" stroke-linecap="round"/>
    <path d="M96 140 Q104 152 112 144" fill="none" stroke="#3b2a1f" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 116 C124 150 160 160 180 120 C192 96 206 84 214 70" fill="none" stroke="#3b2a1f" stroke-width="28" stroke-linecap="round"/>
    <path d="M120 116 C124 150 160 160 180 120 C192 96 206 84 214 70" fill="none" stroke="#bcc6d2" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
