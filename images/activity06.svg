<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Cartoon of two robot hubs: one with a distance sensor sends a signal to the other, which spins a motor">
  <!-- Illustration, not a photo of the real build -->
  <rect width="800" height="600" fill="#e4eef7"/>
  <g fill="#c9dcee"><circle cx="40" cy="40" r="5"/><circle cx="760" cy="60" r="5"/><circle cx="60" cy="560" r="5"/><circle cx="740" cy="540" r="5"/><circle cx="400" cy="60" r="5"/></g>

  <!-- sender hub with distance sensor -->
  <g stroke="#3b2a1f" stroke-width="6" stroke-linejoin="round">
    <rect x="125" y="140" width="130" height="64" rx="22" fill="#fff"/>
    <circle cx="163" cy="172" r="20" fill="#3b2a1f"/>
    <circle cx="217" cy="172" r="20" fill="#3b2a1f"/>
    <rect x="80" y="230" width="220" height="250" rx="26" fill="#fff"/>
    <rect x="80" y="230" width="220" height="70" rx="26" fill="#f2c94c"/>
    <path d="M190 204 v26" fill="none"/>
    <circle cx="190" cy="440" r="16" fill="#e4eef7"/>
  </g>
  <circle cx="168" cy="166" r="7" fill="#6fb3e8"/><circle cx="222" cy="166" r="7" fill="#6fb3e8"/>
  <g fill="#f2c94c">
    <rect x="140" y="320" width="18" height="18" rx="3"/><rect x="166" y="320" width="18" height="18" rx="3" fill="#e9e3d4"/><rect x="192" y="320" width="18" height="18" rx="3"/><rect x="218" y="320" width="18" height="18" rx="3" fill="#e9e3d4"/>
    <rect x="140" y="346" width="18" height="18" rx="3" fill="#e9e3d4"/><rect x="166" y="346" width="18" height="18" rx="3"/><rect x="192" y="346" width="18" height="18" rx="3" fill="#e9e3d4"/><rect x="218" y="346" width="18" height="18" rx="3"/>
    <rect x="140" y="372" width="18" height="18" rx="3"/><rect x="166" y="372" width="18" height="18" rx="3" fill="#e9e3d4"/><rect x="192" y="372" width="18" height="18" rx="3"/><rect x="218" y="372" width="18" height="18" rx="3" fill="#e9e3d4"/>
  </g>
  <!-- something close to the sensor: a little bat -->
  <path d="M120 95 q14 -18 28 0 q8 -10 14 -2 q6 -8 14 2 q14 -18 28 0 q-20 4 -28 18 q-6 -8 -14 -8 q-8 0 -14 8 q-8 -14 -28 -18z" fill="#5b3f2c" stroke="#3b2a1f" stroke-width="3"/>

  <!-- signal waves -->
  <g fill="none" stroke="#2a5f93" stroke-width="10" stroke-linecap="round">
    <path d="M330 300 a60 60 0 0 1 0 90"/>
    <path d="M370 270 a100 100 0 0 1 0 150"/>
    <path d="M410 240 a140 140 0 0 1 0 210"/>
  </g>

  <!-- receiver hub with spinning motor -->
  <g stroke="#3b2a1f" stroke-width="6" stroke-linejoin="round">
    <rect x="500" y="230" width="220" height="250" rx="26" fill="#fff"/>
    <rect x="500" y="230" width="220" height="70" rx="26" fill="#f2c94c"/>
    <circle cx="610" cy="440" r="16" fill="#e4eef7"/>
    <path d="M610 204 v26" fill="none"/>
    <circle cx="610" cy="150" r="56" fill="#fff"/>
    <circle cx="610" cy="150" r="22" fill="#6fb3e8"/>
    <path d="M598 150 h24 M610 138 v24" fill="none" stroke-width="5"/>
  </g>
  <g fill="none" stroke="#e05a5a" stroke-width="7" stroke-linecap="round">
    <path d="M540 108 a80 80 0 0 1 60 -36"/>
    <path d="M680 192 a80 80 0 0 1 -60 36"/>
  </g>
  <path d="M600 60 l14 12 -18 6z M620 240 l-14 -12 18 -6z" fill="#e05a5a"/>
  <g fill="#2a5f93">
    <rect x="560" y="320" width="18" height="18" rx="3"/><rect x="586" y="320" width="18" height="18" rx="3"/><rect x="612" y="320" width="18" height="18" rx="3"/><rect x="638" y="320" width="18" height="18" rx="3"/>
    <rect x="560" y="346" width="18" height="18" rx="3" fill="#e9e3d4"/><rect x="586" y="346" width="18" height="18" rx="3"/><rect x="612" y="346" width="18" height="18" rx="3"/><rect x="638" y="346" width="18" height="18" rx="3" fill="#e9e3d4"/>
    <rect x="560" y="372" width="18" height="18" rx="3" fill="#e9e3d4"/><rect x="586" y="372" width="18" height="18" rx="3" fill="#e9e3d4"/><rect x="612" y="372" width="18" height="18" rx="3" fill="#e9e3d4"/><rect x="638" y="372" width="18" height="18" rx="3" fill="#e9e3d4"/>
  </g>

  <!-- Jumbo peeking up between the hubs -->
  <g transform="translate(328 470) scale(0.62)">
    <g stroke="#3b2a1f" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="56" cy="104" rx="48" ry="54" fill="#a9b4c1"/>
      <ellipse cx="60" cy="108" rx="30" ry="36" fill="#f6b6c6" stroke="none"/>
      <ellipse cx="184" cy="104" rx="48" ry="54" fill="#a9b4c1"/>
      <ellipse cx="180" cy="108" rx="30" ry="36" fill="#f6b6c6" stroke="none"/>
      <circle cx="120" cy="104" r="60" fill="#bcc6d2"/>
    </g>
    <ellipse cx="98" cy="96" rx="8" ry="11" fill="#1f2630"/>
    <ellipse cx="142" cy="96" rx="8" ry="11" fill="#1f2630"/>
    <circle cx="101" cy="91" r="3" fill="#fff"/><circle cx="145" cy="91" r="3" fill="#fff"/>
    <ellipse cx="86" cy="124" rx="10" ry="6.5" fill="#f6a3b8"/><ellipse cx="154" cy="124" rx="10" ry="6.5" fill="#f6a3b8"/>
    <path d="M120 116 C120 140 118 150 120 160" fill="none" stroke="#3b2a1f" stroke-width="30" stroke-linecap="round"/>
    <path d="M120 116 C120 140 118 150 120 160" fill="none" stroke="#bcc6d2" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
