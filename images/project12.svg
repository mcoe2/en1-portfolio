<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Cartoon of a LEGO robot with a color sensor scanning an apple, with a banana and an orange waiting their turn">
  <!-- Illustration, not a photo of the real robot -->
  <rect width="800" height="600" fill="#f3e3c7"/>
  <rect y="430" width="800" height="170" fill="#d9b98a"/>
  <path d="M0 430 H800" stroke="#3b2a1f" stroke-width="6"/>
  <g stroke="#3b2a1f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- wheels -->
    <circle cx="150" cy="420" r="46" fill="#2b2b2b"/>
    <circle cx="150" cy="420" r="16" fill="#9aa7b4"/>
    <circle cx="350" cy="420" r="46" fill="#2b2b2b"/>
    <circle cx="350" cy="420" r="16" fill="#9aa7b4"/>
    <!-- hub -->
    <rect x="110" y="200" width="290" height="190" rx="22" fill="#f7f4ec"/>
    <rect x="110" y="330" width="290" height="60" rx="14" fill="#f2c94c"/>
    <!-- light matrix showing a 1 -->
    <rect x="180" y="226" width="150" height="90" rx="10" fill="#2a2a2a"/>
    <g fill="#f2c94c" stroke="none">
      <rect x="248" y="236" width="14" height="14" rx="3"/>
      <rect x="230" y="254" width="14" height="14" rx="3"/>
      <rect x="248" y="254" width="14" height="14" rx="3"/>
      <rect x="248" y="272" width="14" height="14" rx="3"/>
      <rect x="248" y="290" width="14" height="14" rx="3"/>
    </g>
    <circle cx="255" cy="358" r="13" fill="#7fd3c0"/>
    <!-- color sensor -->
    <rect x="400" y="300" width="70" height="56" rx="10" fill="#f7f4ec"/>
    <circle cx="470" cy="328" r="16" fill="#2a2a2a"/>
    <circle cx="470" cy="328" r="6" fill="#e05a5a" stroke="none"/>
  </g>
  <!-- scanning beam -->
  <path d="M486 312 L560 286 L560 370 L486 344 Z" fill="#e05a5a" opacity="0.25"/>
  <g stroke="#3b2a1f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- apple being scanned -->
    <path d="M610 270 C570 255 548 300 556 340 C564 380 590 398 610 390 C630 398 656 380 664 340 C672 300 650 255 610 270 Z" fill="#e05a5a"/>
    <path d="M610 272 Q612 252 622 240" fill="none"/>
    <path d="M618 252 Q640 236 654 250 Q636 262 618 252 Z" fill="#6fae5a"/>
    <!-- banana -->
    <path d="M560 470 C600 520 690 520 730 460 C700 488 616 496 574 456 Z" fill="#f2d14c"/>
    <path d="M560 470 l-12 -8" fill="none"/>
    <!-- orange -->
    <circle cx="700" cy="380" r="40" fill="#f2994a"/>
    <path d="M700 340 l4 -10" fill="none"/>
  </g>
  <!-- little sparkle -->
  <path d="M560 210 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#f2c94c"/>
  <path d="M90 120 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z" fill="#f2c94c"/>
</svg>
