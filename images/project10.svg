    <g stroke="#3b2a1f" stroke-width="6" stroke-linejoin="round">
      <ellipse cx="38" cy="96" rx="40" ry="46" fill="#fffaf0"/>
      <ellipse cx="162" cy="96" rx="40" ry="46" fill="#fffaf0"/>
      <path d="M50 100 a50 50 0 0 1 100 0 v120 q-12 18 -25 0 q-12 18 -25 0 q-12 18 -25 0 q-12 18 -25 0z" fill="#fffaf0"/>
    </g>
    <ellipse cx="82" cy="96" rx="9" ry="13" fill="#3b2a1f"/>
    <ellipse cx="118" cy="96" rx="9" ry="13" fill="#3b2a1f"/>
    <path d="M100 118 C100 150 96 162 108 172 C118 180 130 172 128 160" fill="none" stroke="#3b2a1f" stroke-width="22" stroke-linecap="round"/>
    <path d="M100 118 C100 150 96 162 108 172 C118 180 130 172 128 160" fill="none" stroke="#fffaf0" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="72" cy="128" rx="8" ry="5" fill="#f6b6c6"/><ellipse cx="128" cy="128" rx="8" ry="5" fill="#f6b6c6"/>
